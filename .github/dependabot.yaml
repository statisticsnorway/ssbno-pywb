version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10
  commit-message: 
    prefix: "build: "
  cooldown:
    default-days: 7

- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "weekly"
  commit-message: 
    prefix: "build: "
  cooldown:
    default-days: 7

- package-ecosystem: "docker-compose"
  directory: "/"
  schedule:
    interval: "weekly"
  commit-message: 
    prefix: "build: "
  cooldown:
    default-days: 7

- package-ecosystem: "pip" 
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    minor-and-patch:
      update-types:
        - "minor"
        - "patch"
  commit-message: 
    prefix: "build: "
  cooldown:
    default-days: 7

- package-ecosystem: "npm"
  directory: "/pywb/vueui"
  schedule:
    interval: "weekly"
  groups:
    minor-and-patch:
      update-types:
        - "minor"
        - "patch"
  commit-message: 
    prefix: "build: "
  cooldown:
    default-days: 7